# One file for every machine, wired or wireless.
#
# The split matters. NetworkManager spoofs the wired address; iwd spoofs the
# wireless one. Letting both try the same interface is what breaks setups: the
# two randomizations fight and the real address goes out. So each is told
# plainly which half is its own, and neither is switched off wholesale.
#
# On a machine with no wireless card the wifi lines simply do nothing, so the
# same file can be deployed everywhere without a per-machine variant.
[main]
# Do not take a hostname from the network. This is a separate leak from sending
# one: NetworkManager otherwise does a reverse lookup of the address it was
# given and renames the qube to whatever the router knows that address as.
hostname-mode=none
wifi.backend=iwd

[connection]
ethernet.cloned-mac-address=random
wifi.cloned-mac-address=preserve
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
# Without this the DHCP client id carries the real address and the spoofing
# above is undone by the very next packet.
ipv4.dhcp-client-id=mac
