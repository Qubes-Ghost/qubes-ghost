# /etc/iwd/main.conf - wireless half of the spoofing, and silence.
# From the sys-net checklist by tommy, forum.qubes-os.org topic 43535.
#
# The scan settings are the part worth having on a laptop that travels: without
# them the machine keeps calling out the names of networks it knows, which
# identifies its owner far more precisely than any single address does.
[General]
AddressRandomization=once
AddressRandomizationRange=full

[Scan]
DisableRoamingScan=true
DisablePeriodicScan=true
